/*
 * Modern Gradle build file for Java application
 */

plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.guava:guava:32.1.3-jre'
    testImplementation 'junit:junit:4.13.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'App'
}

tasks.named('test') {
    useJUnitPlatform()  // Not strictly needed for JUnit 4, but good practice
}

task hello {
    doLast {
        println 'hello this is written'
    }
}

task addition {
    doLast {
        def x = 10
        def y = 20
        println x + y
    }
}
